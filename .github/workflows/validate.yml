name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  chezmoi-validate:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install chezmoi
        run: |
          curl --proto '=https' --proto-redir '=https' -fsSL https://get.chezmoi.io -o "$RUNNER_TEMP/install-chezmoi.sh"
          sh "$RUNNER_TEMP/install-chezmoi.sh"
      - name: Render templates
        run: |
          for f in *.tmpl .chezmoiignore; do
            [ -f "$f" ] && ./bin/chezmoi execute-template --source . < "$f" > /dev/null
          done
      - name: Install Zsh
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
      - name: Check rendered Zsh syntax
        run: |
          zsh -n private_dot_zshenv
          tmpdir="$(mktemp -d)"
          for f in private_dot_zprofile.tmpl private_dot_zshrc.tmpl; do
            ./bin/chezmoi execute-template --source . < "$f" > "$tmpdir/${f%.tmpl}"
            zsh -n "$tmpdir/${f%.tmpl}"
          done
      - name: Dry-run apply
        run: ./bin/chezmoi apply --source . --destination "$(mktemp -d)" --dry-run --exclude=encrypted
